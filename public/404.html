<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Library Access Tracker</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect for React Router
      // This handles client-side routing by redirecting 404s to index.html
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var redirect = basePath + '/';
      sessionStorage.setItem('redirect', redirect);
      window.location.replace(redirect);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
